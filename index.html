<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Sciacca family on the web.">
  <title>The Sciaccas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text-primary: #2a2520;
      --text-secondary: #6b635c;
      --text-tertiary: #9a9189;
      --bg-page: #f7f2ea;
      --bg-card: #ffffff;
      --bg-card-hover: #fdfaf5;
      --border: rgba(60, 40, 20, 0.10);
      --accent: #a8624a;
      --accent-soft: rgba(168, 98, 74, 0.10);
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.6;
      font-size: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      padding: 3rem 1.25rem 2rem;
    }

    .container {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 0;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .surname {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 56px;
      font-weight: 500;
      letter-spacing: -1px;
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .surname .amp {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
    }

    .members {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      transition: all 0.18s ease;
    }

    .member:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .member.placeholder {
      cursor: default;
      opacity: 0.6;
    }

    .member.placeholder:hover {
      background: var(--bg-card);
      border-color: var(--border);
      transform: none;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--accent);
    }

    .member.placeholder .avatar {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-tertiary);
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .member-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .arrow {
      color: var(--text-tertiary);
      font-size: 18px;
      flex-shrink: 0;
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .member:hover .arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    .member.placeholder .arrow {
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    @media (max-width: 540px) {
      body { padding: 2rem 1rem 1.5rem; }
      .surname { font-size: 44px; }
      .member { padding: 14px 16px; gap: 12px; }
      .avatar { width: 42px; height: 42px; font-size: 16px; }
      .member-name { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <h1 class="surname">The Sciacca<span class="amp">s</span></h1>
      <p class="subtitle">Family on the web</p>
    </header>

    <div class="members">

      <a href="https://joseph.sciacca.me" class="member">
        <div class="avatar">J</div>
        <div class="member-info">
          <div class="member-name">Joseph</div>
          <div class="member-desc">joseph.sciacca.me</div>
        </div>
        <span class="arrow">&rarr;</span>
      </a>

      <div class="member placeholder">
        <div class="avatar">&middot;</div>
        <div class="member-info">
          <div class="member-name">Coming soon</div>
          <div class="member-desc">Another Sciacca's spot</div>
        </div>
      </div>

      <div class="member placeholder">
        <div class="avatar">&middot;</div>
        <div class="member-info">
          <div class="member-name">Coming soon</div>
          <div class="member-desc">Another Sciacca's spot</div>
        </div>
      </div>

    </div>

    <footer>
      sciacca.me
    </footer>

  </div>
</body>
</html>
